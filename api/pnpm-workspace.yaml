allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  bigint-buffer: true
  bufferutil: true
  utf-8-validate: true
  protobufjs: false
overrides:
  # jito-ts 3.0.1 (via @pythnetwork/solana-utils, the Pyth receiver SDK) pins web3.js 1.77.4, which requires
  # rpc-websockets/dist/lib/client: not exported by the rpc-websockets it resolves (ERR_PACKAGE_PATH_NOT_EXPORTED, 10-05).
  # One web3.js (the API's 1.99) for every package.
  "jito-ts>@solana/web3.js": 1.99.0
